[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-slow-representations"
version = "0.2.0"
description = "Auditable factor recovery and finite-window slow-factor selection"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["slowrepr*"]
