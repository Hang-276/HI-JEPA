[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hijepa-research"
version = "0.1.0"
description = "Proposal-aligned HI-JEPA mechanism experiment implementation"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy==2.5.3", "torch==2.14.0"]

[project.scripts]
hijepa = "hijepa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
